name: Deploy Demo

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        # If this fails with "Get Pages site failed", enable Pages once in:
        # Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.
        # The action's enablement mode requires a separate admin token, so this
        # public starter keeps the safer manual one-time setup.
        uses: actions/configure-pages@v5

      - name: Build demo site
        run: npm run verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
