<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termlet Renderer Kit Example</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      background: #06110d;
      color: #e8fff0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 70% 20%, rgba(46, 160, 67, .24), transparent 34%),
        linear-gradient(135deg, #050807, #07150f 60%, #02110c);
    }

    main {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    section {
      min-width: 0;
    }

    h1 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      grid-column: 1 / -1;
      max-width: 720px;
      margin: 0 0 8px;
      color: #acc8b8;
      font-size: 16px;
      line-height: 1.7;
    }

    .terminal {
      min-height: 360px;
      border-radius: 12px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .34);
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Renderer Kit</h1>
    <p>同一个终端核心可以换成字符环绕、命令雨或自定义动效。命令、文件系统和安全模型仍由 Termlet 统一处理。</p>
    <section>
      <div id="orbit" class="terminal"></div>
    </section>
    <section>
      <div id="rain" class="terminal"></div>
    </section>
  </main>

  <script type="module">
    import {
      DomTerminalRenderer,
      createOrbitRenderer,
      createRainRenderer,
      createTerminal,
      injectDefaultStyles,
      ok,
    } from '../../dist/index.mjs';

    injectDefaultStyles();

    const orbit = createTerminal({ hostname: 'orbit', cwd: '/home/guest/lab' });
    orbit.fs.ensureDir('/home/guest/lab', { owner: 'guest', group: 'guest' });
    orbit.fs.addFile('/home/guest/lab/readme.txt', 'type, ls, cat readme.txt\n', { owner: 'guest', group: 'guest' });
    orbit.register('spark', () => ok('characters orbit the terminal safely\n'));

    new DomTerminalRenderer(orbit, {
      mount: '#orbit',
      theme: 'crt',
      welcome: '',
      prompt: () => 'orbit$',
      renderer: createOrbitRenderer({
        liveInput: true,
        radius: 96,
        ringGap: 30,
        turns: 3,
      }),
    }).attach();

    const rain = createTerminal({ hostname: 'rain', cwd: '/home/guest/cloud' });
    rain.fs.ensureDir('/home/guest/cloud', { owner: 'guest', group: 'guest' });
    rain.fs.addFile('/home/guest/cloud/notes.txt', 'falling output stays inside the terminal\n', { owner: 'guest', group: 'guest' });
    rain.register('drop', () => ok('tokens fall, fade, and disappear\n'));

    new DomTerminalRenderer(rain, {
      mount: '#rain',
      theme: 'linux',
      welcome: '',
      prompt: () => 'rain$',
      renderer: createRainRenderer({
        inputMaxTokens: 12,
        maxTokens: 18,
      }),
    }).attach();
  </script>
</body>
</html>
