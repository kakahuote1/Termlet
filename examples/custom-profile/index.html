<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termlet Custom Profile</title>
  <link rel="icon" href="../../site-src/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      background: #101317;
      color: #e6edf3;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(980px, 100%);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    p {
      color: #aab6c5;
      margin: 0 0 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Custom Profile</h1>
    <p>Try: items, i, items | only Kind tool, items | only Kind tool | names</p>
    <div id="terminal"></div>
  </main>

  <script type="module">
    import {
      createTerminal,
      DomTerminalRenderer,
      injectDefaultStyles,
    } from '../../src/index.mjs';
    import { labProfile } from './profile.mjs';

    injectDefaultStyles();

    const terminal = createTerminal({
      hostname: 'profile-demo',
      profile: labProfile,
    });

    new DomTerminalRenderer(terminal, {
      mount: '#terminal',
      welcome: 'Try: items, i, items | only Kind tool, items | only Kind tool | names\\n',
    }).attach();
  </script>
</body>
</html>
