<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Terminal Example</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      background: #101317;
      color: #e6edf3;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(980px, 100%);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Blog Terminal</h1>
    <div id="terminal"></div>
  </main>

  <script type="module">
    import {
      createTerminal,
      createDomTerminalAdapter,
      createTerminalSession,
      blogSandboxPreset,
      injectDefaultStyles,
    } from '../../dist/index.mjs';

    injectDefaultStyles();

    const terminal = createTerminal({
      hostname: 'blog-server',
      plugins: [
        blogSandboxPreset({
          rootSecret: 'example private content\n',
        }),
      ],
    });

    const session = createTerminalSession(terminal);
    createDomTerminalAdapter({
      mount: '#terminal',
      welcome: 'Try: help, ls -al, tree /home/guest, sudo -l, journalctl -n 3\n',
    }).mount(session);
  </script>
</body>
</html>
