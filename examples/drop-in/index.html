<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termlet Drop-in Example</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./termlet/termlet.css">
  <style>
    body {
      margin: 0;
      min-width: 320px;
      background: #101014;
      color: #f4f4f5;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 6vw, 56px);
      line-height: 1.05;
    }

    p {
      margin: 0 0 24px;
      color: #cbd5e1;
      line-height: 1.7;
    }

    #terminal {
      min-height: 420px;
    }
  </style>
</head>
<body>
  <main>
    <h1>博客终端</h1>
    <p>复制这个文件，改几行配置，就能把 Termlet 放进自己的静态博客。</p>
    <div id="terminal"></div>
  </main>

  <script type="module">
    import { mountStarterTerminal } from './termlet/index.mjs';

    await mountStarterTerminal({
      mount: '#terminal',
      injectStyles: false,
      theme: 'crt',
      siteName: 'My Blog',
      intro: 'Welcome to my terminal.',
      files: {
        '/home/guest/blog/about.txt': 'Edit this text for your own blog.\n',
      },
      commands: {
        hello: 'hello from Termlet\n',
      },
    });
  </script>
</body>
</html>
